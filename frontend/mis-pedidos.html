<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Mis pedidos — Grupo Genco Siniestros</title>
  <meta name="theme-color" content="#253883">
  <link rel="icon" href="/img/genco.png">
  <link rel="stylesheet" href="/css/estilos.css">
</head>
<body class="cargando">
  <header class="site-header">
    <div class="container">
      <a class="logos" href="/mis-pedidos" aria-label="Mis pedidos — inicio">
        <img class="logo-genco" src="/img/genco.png" alt="Grupo Genco">
      </a>
      <div class="header-right">
        <div id="menu-usuario"></div>
        <span class="divider" aria-hidden="true"></span>
        <img class="logo-stellantis ocultar-movil" src="/img/stellantis.png" alt="Stellantis">
      </div>
    </div>
  </header>

  <main class="container">
    <!-- Lista -->
    <section id="view-lista">
      <div class="page-head">
        <div>
          <h1>Mis pedidos</h1>
          <p id="subtitulo"></p>
        </div>
      </div>
      <p class="aviso-spam-linea" role="note">
        <span data-icono="mail"></span>
        <span>¿No te llegan los mails con las novedades? Revisá la carpeta de <strong>Spam</strong> o <strong>Correo no deseado</strong>.</span>
      </p>
      <div id="resena"></div>
    </section>

    <!-- Detalle -->
    <section id="view-detalle" class="hidden">
      <a class="back" href="#/">← Mis pedidos</a>
      <div id="detalle" style="margin-top:16px"></div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <span>Grupo Genco · Siniestros</span>
      <img src="/img/stellantis.png" alt="Stellantis">
    </div>
  </footer>

  <script type="module" src="/js/paginas/mis-pedidos.js"></script>
</body>
</html>
